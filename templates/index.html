<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Go Blog</title>

    <link rel="stylesheet" href="../style/index.css" />
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar">
      <div class="logo">GoBlog</div>

      <div class="nav-links">
        <a href="/">Home</a>

        <button onclick="openCreateDialog()">Add Post</button>
      </div>
    </nav>

    <!-- MAIN -->

    <main class="container">
      <h1>All Blog Posts</h1>

      <div class="posts">
        {{range .}}

        <div class="post-card">
          <h2>
            <a href="/post?id={{.ID}}"> {{.Title}} </a>
          </h2>

          <p>{{.Content}}</p>

          <div class="actions">
            <button
              onclick="openUpdateDialog(
                            '{{.ID}}',
                            '{{.Title}}',
                            '{{.Content}}'
                        )"
            >
              Update
            </button>

            <button class="delete-btn" onclick="openDeleteDialog('{{.ID}}')">
              Delete
            </button>
          </div>
        </div>

        {{else}}

        <p>No posts available.</p>

        {{end}}
      </div>
    </main>

    <!-- CREATE DIALOG -->

    <dialog id="createDialog">
      <h2>Create Post</h2>

      <form method="POST" action="/create">
        <label> Title </label>

        <input type="text" name="title" required />

        <label> Content </label>

        <textarea name="content" rows="6" required></textarea>

        <div class="dialog-actions">
          <button type="submit">Create</button>

          <button type="button" onclick="closeDialogs()">Cancel</button>
        </div>
      </form>
    </dialog>

    <!-- UPDATE DIALOG -->

    <dialog id="updateDialog">
      <h2>Update Post</h2>

      <form method="POST" action="/update">
        <input type="hidden" name="id" id="updateId" />

        <label> Title </label>

        <input type="text" name="title" id="updateTitle" required />

        <label> Content </label>

        <textarea
          name="content"
          id="updateContent"
          rows="6"
          required
        ></textarea>

        <div class="dialog-actions">
          <button type="submit">Update</button>

          <button type="button" onclick="closeDialogs()">Cancel</button>
        </div>
      </form>
    </dialog>

    <!-- DELETE DIALOG -->

    <dialog id="deleteDialog">
      <h2>Delete Post</h2>

      <p>Are you sure you want to delete this post?</p>

      <form method="POST" action="/delete">
        <input type="hidden" name="id" id="deleteId" />

        <div class="dialog-actions">
          <button type="submit" class="delete-btn">Delete</button>

          <button type="button" onclick="closeDialogs()">Cancel</button>
        </div>
      </form>
    </dialog>

    <script>
      function openCreateDialog() {
        document.getElementById("createDialog").showModal();
      }

      function openUpdateDialog(id, title, content) {
        document.getElementById("updateId").value = id;

        document.getElementById("updateTitle").value = title;

        document.getElementById("updateContent").value = content;

        document.getElementById("updateDialog").showModal();
      }

      function openDeleteDialog(id) {
        document.getElementById("deleteId").value = id;

        document.getElementById("deleteDialog").showModal();
      }

      function closeDialogs() {
        document.querySelectorAll("dialog").forEach((dialog) => {
          dialog.close();
        });
      }
    </script>
  </body>
</html>
